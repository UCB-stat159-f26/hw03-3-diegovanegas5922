[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-age"
version = "0.1.0"
description = "Analyze tennis players' career age differences"
requires-python = ">=3.9"
dependencies = ["pandas", "matplotlib", "requests", "beautifulsoup4"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["tennis_age*"]